<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#1e1e1e">

	<!-- iOS Home Screen Icon -->
	<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

	<!-- Browser Favicons -->
	<link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
	<link rel="shortcut icon" href="icons/favicon.ico">
</head>
<body>
    <header>
        <h1>Weekly Time Tracker</h1>
		<nav>
            <button id="btn-prev-week">&larr; Last Week</button>
            <h2 id="week-label">Week of...</h2>
            <button id="btn-next-week">Next Week &rarr;</button>
            <button id="btn-current-week">Current Week</button>
            <input type="date" id="jump-to-date" title="Jump to specific date" style="width: auto; max-width: 160px; margin-left: 10px; cursor: pointer;">
        </nav>
		<a href="reports.html" class="nav-link">View Reports</a>
        <a href="manage.html" class="nav-link">Manage Activities & Settings</a>
    </header>

    <main>
        <div class="table-container">
            <table id="tracker-table">
                <thead>
                    <tr id="date-header-row">
                        <th></th>
                        <!-- Sun - Sat headers injected here -->
                    </tr>
                </thead>
                <tbody id="tracker-body">
                    <!-- Shift and Activity rows injected here -->
                </tbody>
                <tfoot id="tracker-footer">
                    <!-- Totals injected here -->
                </tfoot>
            </table>
        </div>
        <div class="actions">
            <button id="btn-save" class="primary-btn">Save Week</button>
            <span id="save-status"></span>
			<div id="weekly-total-display" style="margin-left: auto; font-size: 1.25em; font-weight: bold; color: var(--primary);">
                Week Total: 0.0 hrs
            </div>
        </div>
    </main>

    <script src="db.js"></script>
    <script src="app.js"></script>
	<script>
	if ("serviceWorker" in navigator) {
        // Strip trailing slashes or /index.html to get the clean base directory
        const basePath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        
        // Register dynamically based on the environment
        navigator.serviceWorker.register(`${basePath}/sw.js`, { 
            scope: `${basePath}/` 
        }).catch(console.error);
    }
	</script>
</body>
</html>
