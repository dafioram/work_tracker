<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Activities - Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
</head>
<body>
    <header>
        <h1>Manage Activities</h1>
        <a href="index.html" class="nav-link">&larr; Back to Tracker</a>
    </header>

    <main>
        <section class="card">
            <h2 id="form-title">Add New Activity</h2>
            <form id="activity-form">
                <input type="hidden" id="activity-id">
                <div class="form-group">
                    <label>Activity Name:</label>
                    <input type="text" id="activity-name" required>
                </div>
                <div class="form-group">
                    <label for="activity-order">Display Order (Optional):</label>
                    <input type="number" id="activity-order" min="1" placeholder="Auto (Bottom)">
                </div>
                <div class="form-group">
                    <label>Valid Start Date (Optional):</label>
                    <input type="date" id="activity-start">
                </div>
                <div class="form-group">
                    <label>Valid End Date (Optional):</label>
                    <input type="date" id="activity-end">
                </div>
                <button type="submit" class="primary-btn" id="btn-save-activity">Save Activity</button>
                <button type="button" id="btn-cancel-edit" class="hidden">Cancel</button>
            </form>
        </section>

        <section class="card">
            <h2>Current Activities</h2>
            <table class="data-table" id="activities-table">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Name</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Activities injected here -->
                </tbody>
            </table>
        </section>

        <section class="settings-section card">
            <h2>App Preferences</h2>
            <div class="form-group">
                <label for="setting-first-day">First Day of the Week:</label>
                <select id="setting-first-day">
                    <option value="0">Sunday</option>
                    <option value="1">Monday</option>
                    <option value="6">Saturday</option>
                </select>
            </div>
        </section>

        <section class="card">
            <h2>Data Management</h2>
            <p>Backup or restore your database. Note: Importing will overwrite all current data.</p>
            <div class="data-actions">
                <button id="btn-export">Export to JSON</button>
                <input type="file" id="file-import" accept=".json" style="display:none;">
                <button id="btn-import" class="danger-btn">Import from JSON</button>
            </div>
        </section>
    </main>
    <div id="toast-container"></div>
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Confirm Action</h3>
            <p id="confirm-message"></p>
            <div class="modal-actions">
                <button id="btn-modal-cancel">Cancel</button>
                <button id="btn-modal-confirm" class="danger-btn">Yes, I'm sure</button>
            </div>
        </div>
    </div>
    <script src="db.js"></script>
    <script src="manage.js"></script>
</body>
</html>
